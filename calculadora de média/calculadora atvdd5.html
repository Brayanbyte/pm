<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Média do Aluno</title>
    <link rel="stylesheet" href="calculadora.css">
</head>
<body>


    <div class="container">
        <h2>Calcular Média</h2>


        <label>Nota 1:</label>
        <input type="text" id="nota1">


        <label>Nota 2:</label>
        <input type="text" id="nota2">


        <label>Nota 3 (Trabalho/Prova):</label>
        <input type="text" id="nota3">


        <button onclick="calcularMedia()">Calcular Média</button>


        <p id="resultado"></p>
    </div>


    <script>
        function calcularMedia() {


            let nota1 = document.getElementById("nota1").value;
            let nota2 = document.getElementById("nota2").value;
            let nota3 = document.getElementById("nota3").value;
            let resultado = document.getElementById("resultado");


            if (nota1 === "" || nota2 === "" || nota3 === "") {
                resultado.innerText = "Por favor, preencha todas as notas.";
                resultado.style.color = "black";
                return;
            }


            nota1 = parseFloat(nota1);
            nota2 = parseFloat(nota2);
            nota3 = parseFloat(nota3);


            if (isNaN(nota1) || isNaN(nota2) || isNaN(nota3)) {
                resultado.innerText = "Digite apenas números válidos.";
                resultado.style.color = "black";
                return;
            }


            if (
                nota1 < 0 || nota1 > 10 ||
                nota2 < 0 || nota2 > 10 ||
                nota3 < 0 || nota3 > 10
            ) {
                resultado.innerText = "As notas devem estar entre 0 e 10.";
                resultado.style.color = "black";
                return;
            }


            let media = (nota1 + nota2 + nota3) / 3;
            let situacao = "";
            let cor = "";


            if (media >= 7) {
                situacao = "Aprovado";
                cor = "green";
            } else if (media >= 5) {
                situacao = "Recuperação";
                cor = "orange";
            } else {
                situacao = "Reprovado";
                cor = "red";
            }


            resultado.innerText = "Média: " + media.toFixed(1) + "\nSituação: " + situacao;
            resultado.style.color = cor;


            document.getElementById("nota1").value = "";
            document.getElementById("nota2").value = "";
            document.getElementById("nota3").value = "";
        }
    </script>


</body>
</html>
